version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  apt_packages:
    - cmake
    - doxygen
  jobs:
    pre_build:
      - cmake --preset documentation
      - cmake --build --preset documentation
    build:
      html:
        - sphinx-build -T -j auto -b html -d $READTHEDOCS_OUTPUT/doctrees -D language=en doc $READTHEDOCS_OUTPUT/html

python:
  install:
    - method: uv
      command: sync
      path: python/testghacookiecutter
      extras:
        - docs
sphinx:
  configuration: doc/conf.py
